<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Presensi Selfie</title>
    <script defer src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.js"></script>

    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f4f7f6; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
        .container { background: #ffffff; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 500px; }
        h2, h3 { text-align: center; color: #333; margin-top: 0; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; color: #555; }
        input[type="text"], select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; background-color: #fff; }
        small { color: #888; font-size: 11px; }
        .btn { width: 100%; padding: 14px; font-size: 16px; font-weight: bold; color: white; background-color: #007bff; border: none; border-radius: 6px; cursor: pointer; margin-top: 10px; transition: background 0.3s; }
        .btn:hover { background-color: #0056b3; }
        .btn-success { background-color: #28a745; }
        .btn-success:hover { background-color: #218838; }
        #cameraArea, #resultArea { display: none; text-align: center; margin-top: 15px; }
        video, canvas, img { width: 100%; max-width: 100%; border-radius: 8px; border: 1px solid #ddd; }
        .status { margin-top: 15px; font-size: 14px; text-align: center; font-weight: bold; }
        .section-table { margin-top: 30px; border-top: 2px solid #eee; padding-top: 20px; }
        .search-box { margin-bottom: 15px; }
        .stats-container { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 15px; }
        .stat-badge { background: #e9ecef; border: 1px solid #ced4da; padding: 6px 12px; border-radius: 20px; font-size: 12px; font-weight: bold; color: #495057; }
        .stat-badge span { color: #007bff; font-weight: 800; margin-left: 3px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 13px; }
        table th, table td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        table th { background-color: #f8f9fa; color: #333; }

        /* Snackbar */
        #snackbar { visibility: hidden; min-width: 280px; max-width: 90%; background: #dc3545; color: #fff; text-align: center; border-radius: 8px; padding: 14px 18px; position: fixed; z-index: 99999; left: 50%; bottom: 25px; transform: translateX(-50%); font-size: 14px; font-weight: bold; box-shadow: 0 4px 15px rgba(0,0,0,.25); }
        #snackbar.show { visibility: visible; animation: fadein .3s, fadeout .5s 3s; }
        @keyframes fadein { from { bottom: 0; opacity: 0; } to { bottom: 25px; opacity: 1; } }
        @keyframes fadeout { from { bottom: 25px; opacity: 1; } to { bottom: 0; opacity: 0; } }
    </style>
</head>
<body>

<div class="container">
    <h2>Presensi Selfie</h2>

    <div class="form-group">
        <label for="nama">Nama Lengkap</label>
        <input type="text" id="nama" list="listNama" placeholder="Masukkan nama lengkap">
        <datalist id="listNama"></datalist>
    </div>

    <div class="form-group">
        <label for="bidang">Bidang / Bagian</label>
        <select id="bidang">
            <option value="">-- Pilih Bidang / Bagian --</option>
            <option value="Audit">Audit</option>
            <option value="Fasilitas">Fasilitas</option>
            <option value="KC">KC</option>
            <option value="KI">KI</option>
            <option value="P2">P2</option>
            <option value="Umum">Umum</option>
        </select>
    </div>

    <div class="form-group">
        <label for="nip">NIP</label>
        <input type="text" id="nip" list="listNip" maxlength="18" placeholder="Masukkan 18 digit NIP">
        <datalist id="listNip"></datalist>
        <small>Isi NIP berupa 18 digit angka, tanpa spasi.</small>
    </div>

    <div class="form-group">
        <label for="keterangan">Keterangan</label>
        <input type="text" id="keterangan" placeholder="Masukkan keterangan (opsional)">
        <small>Tuliskan bila ada kondisi tertentu sehingga berada di luar area tugas. <br>Bila ST, tulis no dan tgl ST.</small>
    </div>

    <button type="button" class="btn" id="btnBukaKamera" onclick="bukaKamera()">AMBIL FOTO SELFIE</button>

    <div id="cameraArea">
        <video id="webcam" autoplay playsinline></video>
        <button type="button" class="btn" id="btnShutter" onclick="ambilFoto()">Shutter (Jepret)</button>
    </div>

    <div id="resultArea">
        <img id="hasilFoto" alt="Hasil Selfie">
        <div style="display:flex;gap:10px;margin-top:10px;">
            <button type="button" class="btn" style="background-color:#6c757d;" onclick="fotoUlang()">FOTO ULANG</button>
            <button type="button" class="btn btn-success" id="btnKirim" onclick="kirimData()">KIRIM DATA</button>
        </div>
    </div>

    <canvas id="canvas" style="display:none;"></canvas>
    <div class="status" id="statusPesan"></div>

    <div class="section-table">
        <h3>Daftar Yang Telah Presensi</h3>
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Cari berdasarkan nama atau NIP..." oninput="filterData()">
        </div>

        <div class="stats-container" id="statsContainer">
            <div class="stat-badge">Audit: <span id="stat-Audit">0</span></div>
            <div class="stat-badge">Fasilitas: <span id="stat-Fasilitas">0</span></div>
            <div class="stat-badge">KC: <span id="stat-KC">0</span></div>
            <div class="stat-badge">KI: <span id="stat-KI">0</span></div>
            <div class="stat-badge">P2: <span id="stat-P2">0</span></div>
            <div class="stat-badge">Umum: <span id="stat-Umum">0</span></div>
        </div>

        <table>
            <thead>
                <tr>
                    <th style="width:10%;">No</th>
                    <th>Nama</th>
                    <th>Bidang</th>
                    <th>NIP</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <tr><td colspan="4" style="text-align:center;">Memuat data...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<div id="snackbar"></div>

<script>
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbw6LzLtKjg9HHqlUxswfrojKSfE6kV0MgFwQj5x6Ic3TcO4LFiOaY3rrlEFLJrWBOkr/exec';
    const SPREADSHEET_ID = '1LE0kJCm80R1AaHc14FWfw7S-fUIy5clVYtQ9Ovr4ipA';
    const SHEET_NAME = 'sidak';

    // Koordinat kantor/KJAK
    const KJAK_LAT = -6.153775;
    const KJAK_LNG = 106.842512;
    const BATAS_JARAK = 1000;

    const nipInput = document.getElementById('nip');
    const namaInput = document.getElementById('nama');
    const bidangInput = document.getElementById('bidang');
    const keteranganInput = document.getElementById('keterangan');

    let rawImageBase64 = '';
    let watermarkedImageBase64 = '';
    let dataUserGlobal = [];
    let dataMasterPegawai = [];
    let isModelLoaded = false;

    // Status lokasi saat tombol AMBIL FOTO SELFIE
    let jarakDariKJAK = 0;
    let latitudeSaatKameraDibuka = null;
    let longitudeSaatKameraDibuka = null;
    let wajibIsiKeterangan = false;

    window.onload = async function() {
        if (localStorage.getItem('saved_nama')) namaInput.value = localStorage.getItem('saved_nama');
        if (localStorage.getItem('saved_bidang')) bidangInput.value = localStorage.getItem('saved_bidang');
        if (localStorage.getItem('saved_nip')) nipInput.value = localStorage.getItem('saved_nip');

        muatMasterPegawai();
        muatDataUser();

        try {
            const MODEL_URL = 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api/model/';
            await faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL);
            await faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL);
            isModelLoaded = true;
        } catch (err) {
            console.error('Gagal memuat model deteksi wajah:', err);
        }
    };

    nipInput.addEventListener('keydown', e => { if (e.key === ' ' || e.code === 'Space') e.preventDefault(); });
    nipInput.addEventListener('input', function() { this.value = this.value.replace(/[^0-9]/g, ''); });
    namaInput.addEventListener('input', () => localStorage.setItem('saved_nama', namaInput.value));
    bidangInput.addEventListener('change', () => localStorage.setItem('saved_bidang', bidangInput.value));
    nipInput.addEventListener('input', () => localStorage.setItem('saved_nip', nipInput.value));

    namaInput.addEventListener('change', function() {
        const inputNama = this.value.trim().toLowerCase();
        if (!inputNama) return;
        const pegawai = dataMasterPegawai.find(item => item.nama.trim().toLowerCase() === inputNama);
        if (pegawai) {
            if (pegawai.nip) { nipInput.value = pegawai.nip; localStorage.setItem('saved_nip', pegawai.nip); }
            if (pegawai.bidang) { bidangInput.value = pegawai.bidang; localStorage.setItem('saved_bidang', pegawai.bidang); }
        }
    });

    nipInput.addEventListener('change', function() {
        const inputNip = this.value.trim();
        if (!inputNip) return;
        const pegawai = dataMasterPegawai.find(item => item.nip.trim() === inputNip);
        if (pegawai) {
            if (pegawai.nama) { namaInput.value = pegawai.nama; localStorage.setItem('saved_nama', pegawai.nama); }
            if (pegawai.bidang) { bidangInput.value = pegawai.bidang; localStorage.setItem('saved_bidang', pegawai.bidang); }
        }
    });

    function muatMasterPegawai() {
        const url = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tqx=out:json&sheet=data`;
        fetch(url).then(res => res.text()).then(rep => {
            const jsonString = rep.substring(47, rep.length - 2);
            const data = JSON.parse(jsonString);
            const rows = data.table.rows;
            dataMasterPegawai = [];

            rows.slice(1).forEach(row => {
                if (row.c) {
                    let nama = row.c[0] ? String(row.c[0].v) : '';
                    let bidang = row.c[1] ? String(row.c[1].v) : '';
                    let nip = row.c[2] ? String(row.c[2].v) : '';

                    if (nama.startsWith("'")) nama = nama.substring(1);
                    if (bidang.startsWith("'")) bidang = bidang.substring(1);
                    if (nip.startsWith("'")) nip = nip.substring(1);

                    if (nama || nip) dataMasterPegawai.push({ nama, bidang, nip });
                }
            });

            updateDatalistNama(dataMasterPegawai);
            updateDatalistNip(dataMasterPegawai);
        }).catch(err => console.error('Gagal memuat master pegawai:', err));
    }

    function updateDatalistNama(data) {
        const datalist = document.getElementById('listNama');
        if (!datalist) return;
        datalist.innerHTML = '';
        [...new Set(data.map(item => item.nama))].forEach(nama => {
            if (nama) {
                const option = document.createElement('option');
                option.value = nama;
                datalist.appendChild(option);
            }
        });
    }

    function updateDatalistNip(data) {
        const datalist = document.getElementById('listNip');
        if (!datalist) return;
        datalist.innerHTML = '';
        [...new Set(data.map(item => item.nip))].forEach(nip => {
            if (nip) {
                const option = document.createElement('option');
                option.value = nip;
                datalist.appendChild(option);
            }
        });
    }

    /* =========================
       GPS & JARAK KJAK
    ========================= */

    function dapatkanLokasiGPS() {
        return new Promise((resolve, reject) => {
            if (!navigator.geolocation) {
                reject(new Error('Browser tidak mendukung Geolocation.'));
                return;
            }

            navigator.geolocation.getCurrentPosition(
                position => resolve(position),
                error => reject(error),
                { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
            );
        });
    }

    function hitungJarakMeter(lat1, lon1, lat2, lon2) {
        const R = 6371000;
        const dLat = (lat2 - lat1) * Math.PI / 180;
        const dLon = (lon2 - lon1) * Math.PI / 180;
        const a = Math.sin(dLat / 2) ** 2 +
            Math.cos(lat1 * Math.PI / 180) *
            Math.cos(lat2 * Math.PI / 180) *
            Math.sin(dLon / 2) ** 2;
        return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a)));
    }

    function formatJarak(jarak) {
        return jarak < 1000 ? `${Math.round(jarak)} meter` : `${(jarak / 1000).toFixed(2)} km`;
    }

    function tampilkanSnackbar(pesan) {
        const snackbar = document.getElementById('snackbar');
        snackbar.innerText = pesan;
        snackbar.className = 'show';
        clearTimeout(window.snackbarTimer);
        window.snackbarTimer = setTimeout(() => snackbar.className = '', 3500);
    }

    /* =========================
       BUKA KAMERA
    ========================= */

    async function bukaKamera() {
        if (!validasiForm()) return;

        const nipInputVal = nipInput.value.trim();
        const sudahPresensi = dataUserGlobal.some(item => String(item.nip).trim() === nipInputVal);

        if (sudahPresensi) {
            alert('NIP telah ada di Daftar Yang Telah Presensi');
            return;
        }

        const statusDiv = document.getElementById('statusPesan');
        const btnBukaKamera = document.getElementById('btnBukaKamera');

        btnBukaKamera.disabled = true;
        btnBukaKamera.innerText = 'Mengecek Lokasi...';

        try {
            // GPS diambil ketika AMBIL FOTO SELFIE
            const posisi = await dapatkanLokasiGPS();
            latitudeSaatKameraDibuka = posisi.coords.latitude;
            longitudeSaatKameraDibuka = posisi.coords.longitude;

            jarakDariKJAK = hitungJarakMeter(
                latitudeSaatKameraDibuka,
                longitudeSaatKameraDibuka,
                KJAK_LAT,
                KJAK_LNG
            );

            const jarakText = formatJarak(jarakDariKJAK);
            wajibIsiKeterangan = jarakDariKJAK > BATAS_JARAK;

            // Selalu beritahukan jarak
            statusDiv.style.color = wajibIsiKeterangan ? 'red' : 'green';
            statusDiv.innerText = `Anda berada ${jarakText} dari KJAK.`;

            // Jika > 1 KM, alert tambahan tetapi kamera tetap terbuka
            if (wajibIsiKeterangan) {
                alert(`Anda berada ${jarakText} dari KJAK.\n\nJarak lebih dari 1KM, kolom keterangan wajib diisi.`);
            }

            const stream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: 'user' },
                audio: false
            });

            const video = document.getElementById('webcam');
            video.srcObject = stream;

            document.getElementById('cameraArea').style.display = 'block';
            btnBukaKamera.style.display = 'none';

        } catch (err) {
            console.error('Gagal mendapatkan lokasi/kamera:', err);
            alert('Lokasi GPS tidak dapat diperoleh.\n\nSilakan aktifkan GPS dan izinkan akses lokasi pada browser.');
            statusDiv.innerText = '';
        } finally {
            btnBukaKamera.disabled = false;
            btnBukaKamera.innerText = 'AMBIL FOTO SELFIE';
        }
    }

    /* =========================
       AMBIL FOTO / SHUTTER
    ========================= */

    async function ambilFoto() {
        const video = document.getElementById('webcam');
        const canvas = document.getElementById('canvas');
        const context = canvas.getContext('2d');
        const btnShutter = document.getElementById('btnShutter');

        // Jika > 1 KM, Keterangan wajib diisi sebelum Shutter
        if (wajibIsiKeterangan && !keteranganInput.value.trim()) {
            tampilkanSnackbar('Isi keterangan dulu, baru tekan shutter.');
            keteranganInput.focus();
            return;
        }

        if (!isModelLoaded) {
            alert('Sistem verifikasi wajah sedang menyiapkan model. Silakan tunggu sebentar.');
            return;
        }

        btnShutter.disabled = true;
        btnShutter.innerText = 'Memeriksa Wajah...';

        try {
            const detection = await faceapi
                .detectSingleFace(video, new faceapi.TinyFaceDetectorOptions({ inputSize: 320, scoreThreshold: 0.5 }))
                .withFaceLandmarks();

            if (!detection) {
                alert('Ulangi, wajah tidak terdeteksi dengan jelas');
                resetTombolShutter();
                return;
            }

            const landmarks = detection.landmarks;
            const nose = landmarks.getNose();
            const leftEye = landmarks.getLeftEye();
            const rightEye = landmarks.getRightEye();

            if (!nose || !leftEye || !rightEye || leftEye.length === 0 || rightEye.length === 0) {
                alert('Ulangi, wajah tidak terdeteksi dengan jelas');
                resetTombolShutter();
                return;
            }

            const maxDimension = 1366;
            let width = video.videoWidth;
            let height = video.videoHeight;

            if (width > maxDimension || height > maxDimension) {
                if (width > height) {
                    height = Math.round((height * maxDimension) / width);
                    width = maxDimension;
                } else {
                    width = Math.round((width * maxDimension) / height);
                    height = maxDimension;
                }
            }

            canvas.width = width;
            canvas.height = height;

            context.drawImage(video, 0, 0, width, height);
            rawImageBase64 = canvas.toDataURL('image/jpeg', 0.85);

            const stream = video.srcObject;
            if (stream) stream.getTracks().forEach(track => track.stop());

            document.getElementById('hasilFoto').src = rawImageBase64;
            document.getElementById('cameraArea').style.display = 'none';
            document.getElementById('resultArea').style.display = 'block';

            resetTombolShutter();

        } catch (err) {
            console.error(err);
            alert('Terjadi kesalahan saat mengambil foto.');
            resetTombolShutter();
        }
    }

    function resetTombolShutter() {
        const btnShutter = document.getElementById('btnShutter');
        btnShutter.disabled = false;
        btnShutter.innerText = 'Shutter (Jepret)';
    }

    function fotoUlang() {
        document.getElementById('resultArea').style.display = 'none';
        bukaKamera();
    }

    /* =========================
       VALIDASI
    ========================= */

    function validasiForm() {
        const inputNama = namaInput.value.trim().toLowerCase();
        const inputNip = nipInput.value.trim();

        if (!inputNama) {
            alert('Silakan isi Nama Anda!');
            return false;
        }

        if (!bidangInput.value) {
            alert('Silakan pilih Bidang / Bagian!');
            return false;
        }

        if (inputNip.length !== 18) {
            alert('NIP harus tepat 18 digit angka!');
            return false;
        }

        if (!dataMasterPegawai || dataMasterPegawai.length === 0) {
            alert('Data master pegawai sedang dimuat, silakan tunggu beberapa detik dan coba lagi.');
            return false;
        }

        const namaSesuai = dataMasterPegawai.some(item => item.nama.trim().toLowerCase() === inputNama);
        const nipSesuai = dataMasterPegawai.some(item => item.nip.trim() === inputNip);

        if (!namaSesuai || !nipSesuai) {
            alert('Nama atau NIP tidak terdaftar.');
            return false;
        }

        return true;
    }

    /* =========================
       REVERSE GEOCODING
    ========================= */

    async function dapatkanNamaTempat(lat, lng) {
        try {
            const response = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}&zoom=18&addressdetails=1`);
            const data = await response.json();

            if (data && data.address) {
                const addr = data.address;
                return addr.amenity || addr.building || addr.office || addr.shop || addr.road || addr.suburb || addr.display_name.split(',')[0];
            }

            return 'Lokasi Tidak Terdeteksi';

        } catch (error) {
            console.error('Gagal mengambil nama tempat:', error);
            return 'Lokasi Tidak Terdeteksi';
        }
    }

    /* =========================
       WATERMARK
    ========================= */

    function tempelWatermark(latitude, longitude) {
        return new Promise((resolve) => {
            const img = new Image();

            img.onload = async () => {
                const canvas = document.createElement('canvas');
                const context = canvas.getContext('2d');

                canvas.width = img.width;
                canvas.height = img.height;

                context.drawImage(img, 0, 0);

                const namaTempat = await dapatkanNamaTempat(latitude, longitude);
                const coordText = `${latitude.toFixed(6)}, ${longitude.toFixed(6)} (dekat dengan ${namaTempat})`;

                const namaText = `Nama : ${namaInput.value.trim()}`;
                const nipText = `NIP    : ${nipInput.value.trim()}`;
                const waktuText = `Waktu : ${new Date().toLocaleString('id-ID')}`;
                const lokasiText = `Lokasi: ${coordText}`;

                const padding = 15;
                const fontSize = Math.max(14, Math.round(canvas.width * 0.025));
                const lineHeight = fontSize * 1.4;
                const totalHeight = (lineHeight * 4) + (padding * 2);

                context.fillStyle = 'rgba(0, 0, 0, 0.4)';
                context.fillRect(0, canvas.height - totalHeight, canvas.width, totalHeight);

                context.font = `bold ${fontSize}px Arial, sans-serif`;
                context.fillStyle = '#ffffff';

                let startY = canvas.height - totalHeight + padding + fontSize;

                context.fillText(namaText, padding, startY);
                context.fillText(nipText, padding, startY + lineHeight);
                context.fillText(waktuText, padding, startY + (lineHeight * 2));
                context.fillText(lokasiText, padding, startY + (lineHeight * 3));

                resolve(canvas.toDataURL('image/jpeg', 0.85));
            };

            img.src = rawImageBase64;
        });
    }

    /* =========================
       KIRIM DATA
       GPS TIDAK DIAMBIL ULANG
    ========================= */

    async function kirimData() {
        const statusDiv = document.getElementById('statusPesan');

        statusDiv.style.color = 'blue';
        statusDiv.innerText = 'Memproses data...';

        if (latitudeSaatKameraDibuka === null || longitudeSaatKameraDibuka === null) {
            alert('Lokasi belum tersedia. Silakan ambil foto selfie kembali.');
            statusDiv.innerText = '';
            return;
        }

        if (jarakDariKJAK > BATAS_JARAK && !keteranganInput.value.trim()) {
            alert('Jarak lebih dari 1KM, kolom keterangan wajib diisi.');
            keteranganInput.focus();
            statusDiv.innerText = '';
            return;
        }

        watermarkedImageBase64 = await tempelWatermark(latitudeSaatKameraDibuka, longitudeSaatKameraDibuka);
        prosesKirim(latitudeSaatKameraDibuka, longitudeSaatKameraDibuka);
    }

    function prosesKirim(latitude, longitude) {
        const statusDiv = document.getElementById('statusPesan');

        statusDiv.innerText = 'Mengirim data...';
        document.getElementById('btnKirim').disabled = true;

        const payload = {
            nama: namaInput.value,
            bidang: bidangInput.value,
            nip: nipInput.value,
            keterangan: keteranganInput.value,
            foto: watermarkedImageBase64,
            tanggal: new Date().toLocaleString('id-ID'),
            lokasi: `${latitude}, ${longitude}`
        };

        fetch(SCRIPT_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        })
        .then(() => {
            statusDiv.style.color = 'green';
            statusDiv.innerText = 'Pengecekan biometrik valid dan presensi berhasil.';

            document.getElementById('resultArea').style.display = 'none';
            document.getElementById('btnBukaKamera').style.display = 'block';
            document.getElementById('btnKirim').disabled = false;

            // Reset status lokasi
            jarakDariKJAK = 0;
            latitudeSaatKameraDibuka = null;
            longitudeSaatKameraDibuka = null;
            wajibIsiKeterangan = false;

            setTimeout(muatDataUser, 2000);
        })
        .catch(err => {
            statusDiv.style.color = 'red';
            statusDiv.innerText = 'Gagal mengirim data: ' + err.message;
            document.getElementById('btnKirim').disabled = false;
        });
    }

    /* =========================
       DATA PRESENSI
    ========================= */

    function muatDataUser() {
        const url = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tqx=out:json&sheet=${SHEET_NAME}`;

        fetch(url).then(res => res.text()).then(rep => {
            const jsonString = rep.substring(47, rep.length - 2);
            const data = JSON.parse(jsonString);
            const rows = data.table.rows;

            dataUserGlobal = [];

            rows.slice(1).forEach(row => {
                if (row.c) {
                    let nama = row.c[0] ? String(row.c[0].v) : '';
                    let bidang = row.c[1] ? String(row.c[1].v) : '';
                    let nip = row.c[2] ? String(row.c[2].v) : '';

                    if (nama.startsWith("'")) nama = nama.substring(1);
                    if (bidang.startsWith("'")) bidang = bidang.substring(1);
                    if (nip.startsWith("'")) nip = nip.substring(1);

                    if (nama || nip) dataUserGlobal.push({ nama, bidang, nip });
                }
            });

            dataUserGlobal.reverse();
            hitungStatistikBidang(dataUserGlobal);
            tampilkanTabel(dataUserGlobal);

        }).catch(err => {
            console.error(err);
            document.getElementById('tableBody').innerHTML = '<tr><td colspan="4" style="text-align:center;">Gagal memuat data.</td></tr>';
        });
    }

    function hitungStatistikBidang(data) {
        const hitungan = { Audit: 0, Fasilitas: 0, KC: 0, KI: 0, P2: 0, Umum: 0 };

        data.forEach(item => {
            if (hitungan.hasOwnProperty(item.bidang)) hitungan[item.bidang]++;
        });

        Object.keys(hitungan).forEach(key => {
            const el = document.getElementById(`stat-${key}`);
            if (el) el.innerText = hitungan[key];
        });
    }

    function tampilkanTabel(data) {
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = '';

        if (data.length === 0) {
            tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;">Tidak ada data ditemukan.</td></tr>';
            return;
        }

        data.forEach((item, index) => {
            const tr = document.createElement('tr');
            tr.innerHTML = `<td>${index + 1}</td><td>${item.nama}</td><td>${item.bidang || '-'}</td><td>${item.nip}</td>`;
            tbody.appendChild(tr);
        });
    }

    function calculateSimilarity(str1, str2) {
        const s1 = str1.toLowerCase();
        const s2 = str2.toLowerCase();

        if (s1.includes(s2) || s2.includes(s1)) return 1;

        const track = Array(s2.length + 1).fill(null).map(() => Array(s1.length + 1).fill(null));

        for (let i = 0; i <= s1.length; i += 1) track[0][i] = i;
        for (let j = 0; j <= s2.length; j += 1) track[j][0] = j;

        for (let j = 1; j <= s2.length; j += 1) {
            for (let i = 1; i <= s1.length; i += 1) {
                const indicator = s1[i - 1] === s2[j - 1] ? 0 : 1;

                track[j][i] = Math.min(
                    track[j][i - 1] + 1,
                    track[j - 1][i] + 1,
                    track[j - 1][i - 1] + indicator
                );
            }
        }

        const distance = track[s2.length][s1.length];
        const maxLength = Math.max(s1.length, s2.length);

        return maxLength === 0 ? 1 : (maxLength - distance) / maxLength;
    }

    function filterData() {
        const query = document.getElementById('searchInput').value.trim();

        if (!query) {
            tampilkanTabel(dataUserGlobal);
            return;
        }

        const filtered = dataUserGlobal.filter(item => {
            const simNama = calculateSimilarity(item.nama, query);
            const simNip = calculateSimilarity(item.nip, query);
            return simNama >= 0.6 || simNip >= 0.6;
        });

        tampilkanTabel(filtered);
    }
</script>
