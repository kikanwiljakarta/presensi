<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buku Tamu Kanwil Bea Cukai Jakarta</title>

    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f4f7f6; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
        .container { background: #ffffff; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 500px; }
        h2, h3 { text-align: center; color: #333; margin-top: 0; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; color: #555; }
        input[type="text"], select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; background-color: #fff; }
        .btn { width: 100%; padding: 14px; font-size: 16px; font-weight: bold; color: white; background-color: #28a745; border: none; border-radius: 6px; cursor: pointer; margin-top: 10px; transition: background 0.3s; }
        .btn:hover { background-color: #218838; }
        .btn-secondary { background-color: #007bff; margin-top: 5px; }
        .btn-secondary:hover { background-color: #0056b3; }
        .status { margin-top: 15px; font-size: 14px; text-align: center; font-weight: bold; }
        .section-table { margin-top: 30px; border-top: 2px solid #eee; padding-top: 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 13px; }
        table th { border: 1px solid #ddd; padding: 8px; text-align: center; }
		table td { border: 1px solid #ddd; padding: 8px; }
		table td:nth-child(1) { text-align: center; }
		table td:nth-child(2) { text-align: left; }        
		table th { background-color: #f8f9fa; color: #333; }

        /* Camera styling */
        .camera-container { text-align: center; margin-top: 5px; }
        video, canvas, #fotoPreview { width: 100%; max-height: 250px; border-radius: 6px; border: 1px solid #ccc; background: #000; object-fit: cover; }
        #canvasOutput { display: none; }

        /* Permission Notice Box */
        #permissionNotice { background-color: #fff3cd; color: #856404; padding: 15px; border-radius: 6px; border: 1px solid #ffeeba; text-align: left; margin-bottom: 15px; font-weight: bold; }

        /* Snackbar */
        #snackbar { visibility: hidden; min-width: 280px; max-width: 90%; background: #dc3545; color: #fff; text-align: center; border-radius: 8px; padding: 14px 18px; position: fixed; z-index: 99999; left: 50%; bottom: 25px; transform: translateX(-50%); font-size: 14px; font-weight: bold; box-shadow: 0 4px 15px rgba(0,0,0,.25); }
        #snackbar.show { visibility: visible; animation: fadein .3s, fadeout .5s 3s; }
        @keyframes fadein { from { bottom: 0; opacity: 0; } to { bottom: 25px; opacity: 1; } }
        @keyframes fadeout { from { bottom: 25px; opacity: 1; } to { bottom: 0; opacity: 0; } }
    </style>
</head>
<body>

<div class="container">
    <h2>Buku Tamu Kanwil Bea Cukai Jakarta</h2>

    <!-- Pemberitahuan Izin Kamera -->
    <div id="permissionNotice">
        Mohon berikan izin terlebih dahulu untuk mengakses kamera dengan meng-klik <b>ALLOW</b> atau <b>BERI IZIN</b> pada peramban (browser) Anda.
		<br><br>Refresh kembali halaman ini dengan menarik layar ke bawah
    </div>

    <!-- Bagian Form Utama (Disembunyikan sebelum izin diberikan) -->
    <div id="mainFormContent" style="display: none;">
        <div class="form-group">
            <label for="nama">Nama Lengkap</label>
            <input type="text" id="nama" placeholder="Masukkan nama lengkap">
        </div>

        <div class="form-group">
            <label for="perusahaan">Asal / Perusahaan</label>
            <input type="text" id="perusahaan" placeholder="Masukkan asal instansi / perusahaan">
        </div>

        <div class="form-group">
            <label for="bertemu">Akan Bertemu dengan</label>
            <input type="text" id="bertemu" placeholder="Nama pegawai / bagian yang dituju">
        </div>

        <div class="form-group">
            <label for="keterangan">Keperluan / Keterangan</label>
            <input type="text" id="keterangan" placeholder="Masukkan keperluan kunjungan">
        </div>

        <button type="button" class="btn" id="btnSimpan" onclick="kirimData()">SIMPAN DATA</button>
    </div>

    <!-- Kolom Selfie / Kamera (Selalu Tampil untuk Memancing Pop-up Izin) -->
    <div class="form-group" id="cameraSection">
        <label>Verifikasi Kamera / Foto Selfie</label>
        <div class="camera-container">
            <video id="video" autoplay playsinline></video>
            <canvas id="canvasOutput"></canvas>
            <img id="fotoPreview" style="display:none;" alt="Pratinjau Foto">
            <button type="button" class="btn btn-secondary" id="btnAmbilFoto" onclick="ambilFoto()" style="display:none;">Ambil Foto Selfie</button>
            <button type="button" class="btn btn-secondary" id="btnUlangFoto" onclick="ulangFoto()" style="display:none; background-color: #ffc107; color: #000;">Ulangi Foto</button>
        </div>
    </div>

    <div class="status" id="statusPesan"></div>

    <div class="section-table">
        <h3>Daftar Tamu Hari Ini</h3>
        <table>
            <thead>
                <tr>
                    <th style="width:15%;">No</th>
                    <th>Nama</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <tr><td colspan="2" style="text-align:center;">Memuat data...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<div id="snackbar"></div>

<!-- Memuat Library Face-API.js untuk deteksi wajah manusia -->
<script defer src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.12/dist/face-api.min.js"></script>

<script>
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbysW13xJH3fkixGeIHxdCMlHgrMLEFhY__mlAye67ULnXWvHU0y9q-RG1FiAcOVufGyoA/exec';
    const SPREADSHEET_ID = '1ivqJ4NzYQkDFqHkZaa-bovC97JMwX3IqFuGvKcHs5g8';
    const SHEET_NAME = 'tamu';

    const namaInput = document.getElementById('nama');
    const perusahaanInput = document.getElementById('perusahaan');
    const bertemuInput = document.getElementById('bertemu');
    const keteranganInput = document.getElementById('keterangan');
    
    const video = document.getElementById('video');
    const canvasOutput = document.getElementById('canvasOutput');
    const fotoPreview = document.getElementById('fotoPreview');
    const btnAmbilFoto = document.getElementById('btnAmbilFoto');
    const btnUlangFoto = document.getElementById('btnUlangFoto');
    const permissionNotice = document.getElementById('permissionNotice');
    const mainFormContent = document.getElementById('mainFormContent');

    let base64Foto = '';
    let isModelLoaded = false;
    let dataUserGlobal = [];

    window.onload = async function() {
        if (localStorage.getItem('saved_nama')) namaInput.value = localStorage.getItem('saved_nama');
        if (localStorage.getItem('saved_perusahaan')) perusahaanInput.value = localStorage.getItem('saved_perusahaan');
        if (localStorage.getItem('saved_bertemu')) bertemuInput.value = localStorage.getItem('saved_bertemu');
		if (localStorage.getItem('saved_keterangan')) keteranganInput.value = localStorage.getItem('saved_keterangan'); 
		
        muatDataUser();
        initKamera();
        
        // Memuat model face-api dari CDN untuk deteksi wajah manusia
        try {
            await faceapi.nets.tinyFaceDetector.loadFromUri('https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.12/model/');
            isModelLoaded = true;
        } catch (e) {
            console.warn("Gagal memuat model deteksi wajah, validasi struktur wajah dilewati:", e);
        }
    };

    namaInput.addEventListener('input', () => localStorage.setItem('saved_nama', namaInput.value));
    perusahaanInput.addEventListener('input', () => localStorage.setItem('saved_perusahaan', perusahaanInput.value));
    bertemuInput.addEventListener('input', () => localStorage.setItem('saved_bertemu', bertemuInput.value));
	keteranganInput.addEventListener('input', () => localStorage.setItem('saved_keterangan', keteranganInput.value));
    
	function initKamera() {
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
            tampilkanSnackbar('Peramban Anda tidak mendukung akses kamera.');
            return;
        }

        navigator.mediaDevices.getUserMedia({ video: { width: 480, height: 480 } })
            .then(stream => {
                video.srcObject = stream;
                permissionNotice.style.display = 'none';
                mainFormContent.style.display = 'block';
                btnAmbilFoto.style.display = 'block';
            })
            .catch(err => {
                // JIKA DIBLOKIR / NEVER ALLOW: Tampilkan instruksi khusus cara reset ikon gembok
                permissionNotice.style.display = 'block';
                mainFormContent.style.display = 'none';
                btnAmbilFoto.style.display = 'none';
                
                // Ubah teks pemberitahuan secara dinamis agar pengguna paham
                permissionNotice.innerHTML = `
                    <b>Akses Kamera Diblokir!</b><br>
                    1. Klik <i>titik tiga</i> pilih <i>setting / setelan</i>. <br>
                    2. Ketik di bagian pencarian (gambar kaca pembesar): <b>"Kamera" / "Camera"</b><br>
					3. Pilih <b>gambar Kamera tanpa <del>coret</del></b> <br>
					4. scroll ke bawah, pastikan <i>kikanwiljakarta</i> tidak ada di daftar not allowed / tidak diijinkan<br>
					5. Bila ada di daftar not allowed, klik titik tiga di kanannya, lalu removed.<br>
					6. Kembali lagi ke halaman awal, tarik layar ke bawah.<br>
					7. Pilih <b>Izinkan / Allow</b>
                `;
                
                tampilkanSnackbar('Akses kamera diblokir oleh setelan browser.');
            });
    }

    async function ambilFoto() {
        if (video.readyState !== HTMLMediaElement.HAVE_ENOUGH_DATA) {
            tampilkanSnackbar('Kamera belum siap, mohon tunggu sebentar.');
            return;
        }

        // Validasi apakah ada wajah manusia terdeteksi menggunakan face-api.js
        if (isModelLoaded) {
            const detection = await faceapi.detectSingleFace(video, new faceapi.TinyFaceDetectorOptions());
            if (!detection) {
                tampilkanSnackbar('Foto gagal! Pastikan Anda menghadap kamera, dan cukup cahaya.');
                return;
            }
        }

        canvasOutput.width = video.videoWidth;
        canvasOutput.height = video.videoHeight;
        const ctx = canvasOutput.getContext('2d');
        ctx.drawImage(video, 0, 0, canvasOutput.width, canvasOutput.height);

        base64Foto = canvasOutput.toDataURL('image/jpeg', 0.8);
        fotoPreview.src = base64Foto;
        
        video.style.display = 'none';
        fotoPreview.style.display = 'block';
        btnAmbilFoto.style.display = 'none';
        btnUlangFoto.style.display = 'block';
        tampilkanSnackbar('Foto selfie berhasil diambil!');
    }

    function ulangFoto() {
        base64Foto = '';
        fotoPreview.src = '';
        fotoPreview.style.display = 'none';
        video.style.display = 'block';
        btnUlangFoto.style.display = 'none';
        btnAmbilFoto.style.display = 'block';
    }

    function tampilkanSnackbar(pesan) {
        const snackbar = document.getElementById('snackbar');
        snackbar.innerText = pesan;
        snackbar.className = 'show';
        clearTimeout(window.snackbarTimer);
        window.snackbarTimer = setTimeout(() => snackbar.className = '', 3500);
    }

    function validasiForm() {
        if (!namaInput.value.trim()) {
            tampilkanSnackbar('Silakan isi Nama Lengkap Anda!');
            return false;
        }
        if (!perusahaanInput.value.trim()) {
            tampilkanSnackbar('Silakan isi Asal / Perusahaan Anda!');
            return false;
        }
        if (!bertemuInput.value.trim()) {
            tampilkanSnackbar('Silakan isi nama pegawai yang akan dituju!');
            return false;
        }
        if (!base64Foto) {
            tampilkanSnackbar('Silakan ambil foto selfie terlebih dahulu!');
            return false;
        }
        return true;
    }

    function kirimData() {
        if (!validasiForm()) return;

        const statusDiv = document.getElementById('statusPesan');
        const btnSimpan = document.getElementById('btnSimpan');

        statusDiv.style.color = 'blue';
        statusDiv.innerText = 'Mengirim data & menyimpan foto ke Drive...';
        btnSimpan.disabled = true;

        const payload = {
            nama: namaInput.value,
            perusahaan: perusahaanInput.value,
            bertemu: bertemuInput.value,
            keterangan: keteranganInput.value,
            foto: base64Foto,
            tanggal: new Date().toLocaleString('id-ID')
        };

        fetch(SCRIPT_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        })
        .then(() => {
            statusDiv.style.color = 'green';
            statusDiv.innerText = 'Data tamu berhasil disimpan!';
            tampilkanSnackbar('Data berhasil dikirim!');

            namaInput.value = '';
            perusahaanInput.value = '';
            bertemuInput.value = '';
            keteranganInput.value = '';
            ulangFoto();

            btnSimpan.disabled = false;

            setTimeout(() => {
                statusDiv.innerText = '';
                muatDataUser();
            }, 2000);
        })
        .catch(err => {
            statusDiv.style.color = 'red';
            statusDiv.innerText = 'Gagal mengirim data: ' + err.message;
            btnSimpan.disabled = false;
        });
    }

    function muatDataUser() {
        const url = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tqx=out:json&sheet=${SHEET_NAME}`;

        fetch(url)
            .then(res => res.text())
            .then(rep => {
                const jsonString = rep.substring(47, rep.length - 2);
                const data = JSON.parse(jsonString);
                const rows = data.table.rows;

                dataUserGlobal = [];

                const today = new Date();
                const tglHariIni = 
                    today.getDate() + '/' +
                    (today.getMonth() + 1) + '/' +
                    today.getFullYear();

                rows.slice(1).forEach(row => {
                    if (row.c) {
                        let nama = row.c[0] ? String(row.c[0].v) : '';
                        if (nama.startsWith("'")) {
                            nama = nama.substring(1);
                        }

                        let tanggalTamu = '';
                        if (row.c[4]) {
                            tanggalTamu = row.c[4].f
                                ? String(row.c[4].f)
                                : String(row.c[4].v || '');
                        }

                        let tanggalSaja = tanggalTamu.split(',')[0].trim();

                        if (nama && tanggalSaja === tglHariIni) {
                            dataUserGlobal.push({
                                nama: nama,
                                tanggal: tanggalTamu
                            });
                        }
                    }
                });

                dataUserGlobal.reverse();
                tampilkanTabel(dataUserGlobal);
            })
            .catch(err => {
                console.error(err);
                document.getElementById('tableBody').innerHTML =
                    '<tr><td colspan="2" style="text-align:center;">Gagal memuat data.</td></tr>';
            });
    }

    function tampilkanTabel(data) {
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = '';

        if (data.length === 0) {
            tbody.innerHTML = '<tr><td colspan="2" style="text-align:center;">Tidak ada data tamu hari ini.</td></tr>';
            return;
        }

        data.forEach((item, index) => {
            const tr = document.createElement('tr');
            tr.innerHTML = `<td>${index + 1}</td><td>${item.nama}</td>`;
            tbody.appendChild(tr);
        });
    }
</script>

</body>
</html>
