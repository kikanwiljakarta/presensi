<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Presensi Selfie</title>
    <script defer src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.js"></script>

    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f4f7f6; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
        .container { background: #ffffff; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 500px; }
        h2, h3 { text-align: center; color: #333; margin-top: 0; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; color: #555; }
        input[type="text"], select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; background-color: #fff; }
        small { color: #888; font-size: 11px; }
        .btn { width: 100%; padding: 14px; font-size: 16px; font-weight: bold; color: white; background-color: #007bff; border: none; border-radius: 6px; cursor: pointer; margin-top: 10px; transition: background 0.3s; }
        .btn:hover { background-color: #0056b3; }
        .btn-success { background-color: #28a745; }
        .btn-success:hover { background-color: #218838; }
        #cameraArea, #resultArea { display: none; text-align: center; margin-top: 15px; scroll-margin-bottom: 20px; }
        #btnShutter { scroll-margin-bottom: 24px; }
        video, canvas, img { width: 100%; max-width: 100%; border-radius: 8px; border: 1px solid #ddd; }
        .status { margin-top: 15px; font-size: 14px; text-align: center; font-weight: bold; }
        .section-table { margin-top: 30px; border-top: 2px solid #eee; padding-top: 20px; }
        .search-box { margin-bottom: 15px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 13px; }
        table th, table td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        table th { background-color: #f8f9fa; color: #333; }

        /* Snackbar */
        #snackbar { visibility: hidden; min-width: 280px; max-width: 90%; background: #dc3545; color: #fff; text-align: center; border-radius: 8px; padding: 14px 18px; position: fixed; z-index: 99999; left: 50%; bottom: 25px; transform: translateX(-50%); font-size: 14px; font-weight: bold; box-shadow: 0 4px 15px rgba(0,0,0,.25); }
        #snackbar.show { visibility: visible; animation: fadein .3s, fadeout .5s 3s; }
        @keyframes fadein { from { bottom: 0; opacity: 0; } to { bottom: 25px; opacity: 1; } }
        @keyframes fadeout { from { bottom: 25px; opacity: 1; } to { bottom: 0; opacity: 0; } }
    </style>
</head>
<body>

<div class="container">
    <h2>Presensi Selfie</h2>

    <div class="form-group">
        <label for="nama">Nama Lengkap</label>
        <input type="text" id="nama" list="listNama" placeholder="Masukkan nama lengkap">
        <datalist id="listNama"></datalist>
    </div>

    <div class="form-group">
        <label for="asal">Asal</label>
        <select id="asal">
            <option value="">-- Pilih Asal --</option>
            <option value="Pegawai">Pegawai</option>
            <option value="PKD">PKD</option>
            <option value="CS">CS</option>
            <option value="Pramubakti">Pramubakti</option>
            <option value="Lainnya">Lainnya</option>
        </select>
    </div>

    <div class="form-group">
        <label for="noWa">No WA</label>
        <input type="text" id="noWa" list="listNoWa" maxlength="16" placeholder="Masukkan nomor WA (contoh: 081234567890)">
        <datalist id="listNoWa"></datalist>
        <small>Isi nomor WA berupa angka, tanpa spasi.</small>
    </div>

    <div class="form-group">
        <label for="alamat">Alamat/ Domisili</label>
        <input type="text" id="alamat" placeholder="Masukkan alamat / domisili">
        <small>Tuliskan alamat/domisili atau kondisi tertentu bila berada di luar area tugas.</small>
    </div>

    <button type="button" class="btn" id="btnBukaKamera" onclick="bukaKamera()">AMBIL FOTO SELFIE</button>

    <div id="cameraArea">
        <video id="webcam" autoplay playsinline></video>
        <button type="button" class="btn" id="btnShutter" onclick="ambilFoto()">Shutter (Jepret)</button>
    </div>

    <div id="resultArea">
        <img id="hasilFoto" alt="Hasil Selfie">
        <div style="display:flex;gap:10px;margin-top:10px;">
            <button type="button" class="btn" style="background-color:#6c757d;" onclick="fotoUlang()">FOTO ULANG</button>
            <button type="button" class="btn btn-success" id="btnKirim" onclick="kirimData()">KIRIM DATA</button>
        </div>
    </div>

    <canvas id="canvas" style="display:none;"></canvas>
    <div class="status" id="statusPesan"></div>

    <div class="section-table">
        <h3>Daftar Yang Telah Presensi (Hari Ini)</h3>
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Cari berdasarkan nama..." oninput="filterData()">
        </div>

        <table>
            <thead>
                <tr>
                    <th style="width:15%; text-align:center;">No</th>
                    <th>Nama</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <tr><td colspan="2" style="text-align:center;">Memuat data...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<div id="snackbar"></div>

<script>
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyQN8k6jl_Y2geumKDWHPXUXdenEILiiKUhMKrLBGt5XXT_jMIZD-IxWRyM6JqqCUXO/exec';
    const SPREADSHEET_ID = '19sXkjcyEbr16NRiEofiLxSesRu99wkPxjEQuqvxdYbo';
    const SHEET_NAME = 'presensi';

    // Koordinat kantor/KJAK
    const KJAK_LAT = -6.153775;
    const KJAK_LNG = 106.842512;
    const BATAS_JARAK = 1000;

    const namaInput = document.getElementById('nama');
    const asalInput = document.getElementById('asal');
    const noWaInput = document.getElementById('noWa');
    const alamatInput = document.getElementById('alamat');

    let rawImageBase64 = '';
    let watermarkedImageBase64 = '';
    let dataUserGlobal = [];
    let dataMasterPegawai = [];
    let isModelLoaded = false;

    // Status lokasi saat tombol AMBIL FOTO SELFIE
    let jarakDariKJAK = 0;
    let latitudeSaatKameraDibuka = null;
    let longitudeSaatKameraDibuka = null;
    let wajibIsiAlamat = false;

    window.onload = async function() {
        if (localStorage.getItem('saved_nama')) namaInput.value = localStorage.getItem('saved_nama');
        if (localStorage.getItem('saved_asal')) asalInput.value = localStorage.getItem('saved_asal');
        if (localStorage.getItem('saved_noWa')) noWaInput.value = localStorage.getItem('saved_noWa');
        if (localStorage.getItem('saved_alamat')) alamatInput.value = localStorage.getItem('saved_alamat');

        muatMasterPegawai();
        muatDataUser();

        try {
            const MODEL_URL = 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api/model/';
            await faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL);
            await faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL);
            isModelLoaded = true;
        } catch (err) {
            console.error('Gagal memuat model deteksi wajah:', err);
        }
    };

    noWaInput.addEventListener('keydown', e => { if (e.key === ' ' || e.code === 'Space') e.preventDefault(); });
    noWaInput.addEventListener('input', function() {
        this.value = this.value.replace(/[^0-9]/g, '');
        localStorage.setItem('saved_noWa', this.value);
    });
    namaInput.addEventListener('input', () => localStorage.setItem('saved_nama', namaInput.value));
    asalInput.addEventListener('change', () => localStorage.setItem('saved_asal', asalInput.value));
    alamatInput.addEventListener('input', () => localStorage.setItem('saved_alamat', alamatInput.value));

    namaInput.addEventListener('change', function() {
        const inputNama = this.value.trim().toLowerCase();
        if (!inputNama) return;
        const pegawai = dataMasterPegawai.find(item => item.nama.trim().toLowerCase() === inputNama);
        if (pegawai) {
            if (pegawai.kontak && !noWaInput.value) {
                noWaInput.value = pegawai.kontak;
                localStorage.setItem('saved_noWa', pegawai.kontak);
            }
        }
    });

    function muatMasterPegawai() {
        const url = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tqx=out:json&sheet=data`;
        fetch(url).then(res => res.text()).then(rep => {
            const jsonString = rep.substring(47, rep.length - 2);
            const data = JSON.parse(jsonString);
            const rows = data.table.rows;
            dataMasterPegawai = [];

            rows.slice(1).forEach(row => {
                if (row.c) {
                    let nama = row.c[0] ? String(row.c[0].v) : '';
                    let kontak = row.c[2] ? String(row.c[2].v).replace(/[^0-9]/g, '') : '';

                    if (nama.startsWith("'")) nama = nama.substring(1);

                    if (nama || kontak) dataMasterPegawai.push({ nama, kontak });
                }
            });

            updateDatalistNama(dataMasterPegawai);
            updateDatalistNoWa(dataMasterPegawai);
        }).catch(err => console.error('Gagal memuat master pegawai:', err));
    }

    function updateDatalistNama(data) {
        const datalist = document.getElementById('listNama');
        if (!datalist) return;
        datalist.innerHTML = '';
        [...new Set(data.map(item => item.nama))].forEach(nama => {
            if (nama) {
                const option = document.createElement('option');
                option.value = nama;
                datalist.appendChild(option);
            }
        });
    }

    function updateDatalistNoWa(data) {
        const datalist = document.getElementById('listNoWa');
        if (!datalist) return;
        datalist.innerHTML = '';
        [...new Set(data.map(item => item.kontak))].forEach(kontak => {
            if (kontak) {
                const option = document.createElement('option');
                option.value = kontak;
                datalist.appendChild(option);
            }
        });
    }

    /* =========================
       GPS & JARAK KJAK
    ========================= */

    function dapatkanLokasiGPS() {
        return new Promise((resolve, reject) => {
            if (!navigator.geolocation) {
                reject(new Error('Browser tidak mendukung Geolocation.'));
                return;
            }

            navigator.geolocation.getCurrentPosition(
                position => resolve(position),
                error => reject(error),
                { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
            );
        });
    }

    function hitungJarakMeter(lat1, lon1, lat2, lon2) {
        const R = 6371000;
        const dLat = (lat2 - lat1) * Math.PI / 180;
        const dLon = (lon2 - lon1) * Math.PI / 180;
        const a = Math.sin(dLat / 2) ** 2 +
            Math.cos(lat1 * Math.PI / 180) *
            Math.cos(lat2 * Math.PI / 180) *
            Math.sin(dLon / 2) ** 2;
        return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a)));
    }

    function formatJarak(jarak) {
        return jarak < 1000 ? `${Math.round(jarak)} meter` : `${(jarak / 1000).toFixed(2)} km`;
    }

    function tampilkanSnackbar(pesan) {
        const snackbar = document.getElementById('snackbar');
        snackbar.innerText = pesan;
        snackbar.className = 'show';
        clearTimeout(window.snackbarTimer);
        window.snackbarTimer = setTimeout(() => snackbar.className = '', 3500);
    }

    /* =========================
       BUKA KAMERA
    ========================= */

    async function bukaKamera() {
        if (!validasiForm()) return;

        const namaInputVal = namaInput.value.trim().toLowerCase();
        const sudahPresensi = dataUserGlobal.some(item => String(item.nama).trim().toLowerCase() === namaInputVal);

        if (sudahPresensi) {
            alert('Nama telah ada di Daftar Yang Telah Presensi hari ini.');
            return;
        }

        const statusDiv = document.getElementById('statusPesan');
        const btnBukaKamera = document.getElementById('btnBukaKamera');

        btnBukaKamera.disabled = true;
        btnBukaKamera.innerText = 'Mengecek Lokasi...';

        try {
            const posisi = await dapatkanLokasiGPS();
            latitudeSaatKameraDibuka = posisi.coords.latitude;
            longitudeSaatKameraDibuka = posisi.coords.longitude;

            jarakDariKJAK = hitungJarakMeter(
                latitudeSaatKameraDibuka,
                longitudeSaatKameraDibuka,
                KJAK_LAT,
                KJAK_LNG
            );

            const jarakText = formatJarak(jarakDariKJAK);
            wajibIsiAlamat = jarakDariKJAK > BATAS_JARAK;

            statusDiv.style.color = wajibIsiAlamat ? 'red' : 'green';
            statusDiv.innerText = `Anda berada ${jarakText} dari KJAK.`;

            if (wajibIsiAlamat) {
                alert(`Anda berada ${jarakText} dari KJAK.\n\nJarak lebih dari 1 km, kolom Alamat/ Domisili wajib diisi.`);
            }

            const stream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: 'user' },
                audio: false
            });

            const video = document.getElementById('webcam');
            video.srcObject = stream;

            const cameraArea = document.getElementById('cameraArea');
            const btnShutter = document.getElementById('btnShutter');
            cameraArea.style.display = 'block';
            btnBukaKamera.style.display = 'none';

            setTimeout(() => {
                btnShutter.scrollIntoView({ behavior: 'smooth', block: 'end' });
            }, 150);

        } catch (err) {
            console.error('Gagal mendapatkan lokasi/kamera:', err);
            alert('Lokasi GPS tidak dapat diperoleh.\n\nSilakan aktifkan GPS dan izinkan akses lokasi pada browser.');
            statusDiv.innerText = '';
        } finally {
            btnBukaKamera.disabled = false;
            btnBukaKamera.innerText = 'AMBIL FOTO SELFIE';
        }
    }

    /* =========================
       AMBIL FOTO / SHUTTER
    ========================= */

    async function ambilFoto() {
        const video = document.getElementById('webcam');
        const canvas = document.getElementById('canvas');
        const context = canvas.getContext('2d');
        const btnShutter = document.getElementById('btnShutter');

        if (wajibIsiAlamat && !alamatInput.value.trim()) {
            tampilkanSnackbar('Isi Alamat/ Domisili dulu, baru tekan shutter.');
            alamatInput.focus();
            return;
        }

        if (!isModelLoaded) {
            alert('Sistem verifikasi wajah sedang menyiapkan model. Silakan tunggu sebentar.');
            return;
        }

        btnShutter.disabled = true;
        btnShutter.innerText = 'Memeriksa Wajah...';

        try {
            const detection = await faceapi
                .detectSingleFace(video, new faceapi.TinyFaceDetectorOptions({ inputSize: 320, scoreThreshold: 0.5 }))
                .withFaceLandmarks();

            if (!detection) {
                alert('Ulangi, wajah tidak terdeteksi dengan jelas');
                resetTombolShutter();
                return;
            }

            const landmarks = detection.landmarks;
            const nose = landmarks.getNose();
            const leftEye = landmarks.getLeftEye();
            const rightEye = landmarks.getRightEye();

            if (!nose || !leftEye || !rightEye || leftEye.length === 0 || rightEye.length === 0) {
                alert('Ulangi, wajah tidak terdeteksi dengan jelas');
                resetTombolShutter();
                return;
            }

            const maxDimension = 1366;
            let width = video.videoWidth;
            let height = video.videoHeight;

            if (width > maxDimension || height > maxDimension) {
                if (width > height) {
                    height = Math.round((height * maxDimension) / width);
                    width = maxDimension;
                } else {
                    width = Math.round((width * maxDimension) / height);
                    height = maxDimension;
                }
            }

            canvas.width = width;
            canvas.height = height;

            context.drawImage(video, 0, 0, width, height);
            rawImageBase64 = canvas.toDataURL('image/jpeg', 0.85);

            const stream = video.srcObject;
            if (stream) stream.getTracks().forEach(track => track.stop());

            document.getElementById('hasilFoto').src = rawImageBase64;
            document.getElementById('cameraArea').style.display = 'none';
            document.getElementById('resultArea').style.display = 'block';

            resetTombolShutter();

        } catch (err) {
            console.error(err);
            alert('Terjadi kesalahan saat mengambil foto.');
            resetTombolShutter();
        }
    }

    function resetTombolShutter() {
        const btnShutter = document.getElementById('btnShutter');
        btnShutter.disabled = false;
        btnShutter.innerText = 'Shutter (Jepret)';
    }

    function fotoUlang() {
        document.getElementById('resultArea').style.display = 'none';
        bukaKamera();
    }

    /* =========================
       VALIDASI
    ========================= */

    function validasiForm() {
        const inputNama = namaInput.value.trim();
        const inputNoWa = noWaInput.value.trim();

        if (!inputNama) {
            alert('Silakan isi Nama Lengkap Anda!');
            namaInput.focus();
            return false;
        }

        if (!asalInput.value) {
            alert('Silakan pilih Asal!');
            asalInput.focus();
            return false;
        }

        if (inputNoWa.length < 8) {
            alert('Silakan isi No WA yang valid!');
            noWaInput.focus();
            return false;
        }

        return true;
    }

    /* =========================
       REVERSE GEOCODING
    ========================= */

    async function dapatkanNamaTempat(lat, lng) {
        try {
            const response = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}&zoom=18&addressdetails=1`);
            const data = await response.json();

            if (data && data.address) {
                const addr = data.address;
                return addr.amenity || addr.building || addr.office || addr.shop || addr.road || addr.suburb || addr.display_name.split(',')[0];
            }

            return 'Lokasi Tidak Terdeteksi';

        } catch (error) {
            console.error('Gagal mengambil nama tempat:', error);
            return 'Lokasi Tidak Terdeteksi';
        }
    }

    /* =========================
       WATERMARK
    ========================= */

    function tempelWatermark(latitude, longitude) {
        return new Promise((resolve) => {
            const img = new Image();

            img.onload = async () => {
                const canvas = document.createElement('canvas');
                const context = canvas.getContext('2d');

                canvas.width = img.width;
                canvas.height = img.height;

                context.drawImage(img, 0, 0);

                const namaTempat = await dapatkanNamaTempat(latitude, longitude);
                const coordText = `${latitude.toFixed(6)}, ${longitude.toFixed(6)} (dekat dengan ${namaTempat})`;

                const namaText  = `Nama   : ${namaInput.value.trim()}`;
                const asalText  = `Asal   : ${asalInput.value.trim()}`;
                const noWaText  = `No WA  : ${noWaInput.value.trim()}`;
                const waktuText = `Waktu  : ${new Date().toLocaleString('id-ID')}`;
                const lokasiText = `Lokasi : ${coordText}`;

                const padding = 15;
                const fontSize = Math.max(14, Math.round(canvas.width * 0.025));
                const lineHeight = fontSize * 1.4;
                const totalHeight = (lineHeight * 5) + (padding * 2);

                context.fillStyle = 'rgba(0, 0, 0, 0.45)';
                context.fillRect(0, canvas.height - totalHeight, canvas.width, totalHeight);

                context.font = `bold ${fontSize}px Arial, sans-serif`;
                context.fillStyle = '#ffffff';

                let startY = canvas.height - totalHeight + padding + fontSize;

                context.fillText(namaText, padding, startY);
                context.fillText(asalText, padding, startY + lineHeight);
                context.fillText(noWaText, padding, startY + (lineHeight * 2));
                context.fillText(waktuText, padding, startY + (lineHeight * 3));
                context.fillText(lokasiText, padding, startY + (lineHeight * 4));

                resolve(canvas.toDataURL('image/jpeg', 0.85));
            };

            img.src = rawImageBase64;
        });
    }

    /* =========================
       KIRIM DATA
    ========================= */

    async function kirimData() {
        const statusDiv = document.getElementById('statusPesan');

        statusDiv.style.color = 'blue';
        statusDiv.innerText = 'Memproses data...';

        if (latitudeSaatKameraDibuka === null || longitudeSaatKameraDibuka === null) {
            alert('Lokasi belum tersedia. Silakan ambil foto selfie kembali.');
            statusDiv.innerText = '';
            return;
        }

        if (jarakDariKJAK > BATAS_JARAK && !alamatInput.value.trim()) {
            alert('Jarak lebih dari 1 KM, kolom Alamat/ Domisili wajib diisi.');
            alamatInput.focus();
            statusDiv.innerText = '';
            return;
        }

        watermarkedImageBase64 = await tempelWatermark(latitudeSaatKameraDibuka, longitudeSaatKameraDibuka);
        prosesKirim(latitudeSaatKameraDibuka, longitudeSaatKameraDibuka);
    }

    function prosesKirim(latitude, longitude) {
        const statusDiv = document.getElementById('statusPesan');

        statusDiv.innerText = 'Mengirim data...';
        document.getElementById('btnKirim').disabled = true;

        const payload = {
            nama: namaInput.value.trim(),
            asal: asalInput.value.trim(),
            noWa: noWaInput.value.trim(),
            alamat: alamatInput.value.trim(),
            bidang: asalInput.value.trim(),
            nip: noWaInput.value.trim(),
            keterangan: alamatInput.value.trim(),
            foto: watermarkedImageBase64,
            tanggal: new Date().toLocaleString('id-ID'),
            lokasi: `${latitude}, ${longitude}`
        };

        fetch(SCRIPT_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        })
        .then(() => {
            statusDiv.style.color = 'green';
            statusDiv.innerText = 'Pengecekan biometrik valid dan presensi berhasil.';

            document.getElementById('resultArea').style.display = 'none';
            document.getElementById('btnBukaKamera').style.display = 'block';
            document.getElementById('btnKirim').disabled = false;

            jarakDariKJAK = 0;
            latitudeSaatKameraDibuka = null;
            longitudeSaatKameraDibuka = null;
            wajibIsiAlamat = false;

            setTimeout(muatDataUser, 2000);
        })
        .catch(err => {
            statusDiv.style.color = 'red';
            statusDiv.innerText = 'Gagal mengirim data: ' + err.message;
            document.getElementById('btnKirim').disabled = false;
        });
    }

    /* =========================
       DATA PRESENSI (HARI INI SAJA)
    ========================= */

    function isSameCalendarDay(d1, d2) {
        return d1.getFullYear() === d2.getFullYear() &&
               d1.getMonth() === d2.getMonth() &&
               d1.getDate() === d2.getDate();
    }

    function parseSheetDate(val) {
        if (!val) return null;
        const str = String(val).trim();

        const gvizMatch = str.match(/^Date\((\d+),(\d+),(\d+)(?:,(\d+),(\d+),(\d+))?\)$/);
        if (gvizMatch) {
            return new Date(
                Number(gvizMatch[1]),
                Number(gvizMatch[2]),
                Number(gvizMatch[3]),
                Number(gvizMatch[4] || 0),
                Number(gvizMatch[5] || 0),
                Number(gvizMatch[6] || 0)
            );
        }

        const idMatch = str.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})(?:[,\s]+(\d{1,2})[:.](\d{1,2})(?:[:.](\d{1,2}))?)?/);
        if (idMatch) {
            return new Date(
                Number(idMatch[3]),
                Number(idMatch[2]) - 1,
                Number(idMatch[1]),
                Number(idMatch[4] || 0),
                Number(idMatch[5] || 0),
                Number(idMatch[6] || 0)
            );
        }

        const parsed = new Date(str);
        return isNaN(parsed.getTime()) ? null : parsed;
    }

    function rowIsToday(rowCells, today) {
        let hasAnyDateCell = false;
        for (let i = 0; i < rowCells.length; i++) {
            const cell = rowCells[i];
            if (!cell || cell.v === null || cell.v === undefined) continue;
            const d = parseSheetDate(cell.f || cell.v);
            if (d) {
                hasAnyDateCell = true;
                if (isSameCalendarDay(d, today)) return true;
            }
        }
        return !hasAnyDateCell;
    }

    function muatDataUser() {
        const url = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tqx=out:json&sheet=${SHEET_NAME}`;

        fetch(url).then(res => res.text()).then(rep => {
            const jsonString = rep.substring(47, rep.length - 2);
            const data = JSON.parse(jsonString);
            const rows = data.table.rows || [];
            const today = new Date();

            const todayChronological = [];

            rows.slice(1).forEach(row => {
                if (row.c && rowIsToday(row.c, today)) {
                    let nama = row.c[0] ? String(row.c[0].v) : '';
                    if (nama.startsWith("'")) nama = nama.substring(1);
                    if (nama.trim()) {
                        todayChronological.push({ nama: nama.trim() });
                    }
                }
            });

            dataUserGlobal = todayChronological
                .map((item, idx) => ({
                    no: idx + 1,
                    nama: item.nama
                }))
                .reverse();

            tampilkanTabel(dataUserGlobal);

        }).catch(err => {
            console.error(err);
            document.getElementById('tableBody').innerHTML = '<tr><td colspan="2" style="text-align:center;">Gagal memuat data.</td></tr>';
        });
    }

    function tampilkanTabel(data) {
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = '';

        if (data.length === 0) {
            tbody.innerHTML = '<tr><td colspan="2" style="text-align:center;">Belum ada presensi hari ini.</td></tr>';
            return;
        }

        data.forEach(item => {
            const tr = document.createElement('tr');
            tr.innerHTML = `<td style="text-align:center;">${item.no}</td><td>${item.nama}</td>`;
            tbody.appendChild(tr);
        });
    }

    function filterData() {
        const query = document.getElementById('searchInput').value.trim().toLowerCase();

        if (!query) {
            tampilkanTabel(dataUserGlobal);
            return;
        }

        const filtered = dataUserGlobal.filter(item => item.nama.toLowerCase().includes(query));
        tampilkanTabel(filtered);
    }
</script>
